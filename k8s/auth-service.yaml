apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hireconnect
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: hireconnect/auth-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__AuthDb
          valueFrom:
            secretKeyRef:
              name: hireconnect-secrets
              key: auth-db-connection
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: hireconnect
spec:
  selector:
    app: auth-service
  ports:
  - port: 80
    targetPort: 8080
